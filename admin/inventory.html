<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Favo Cafe</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="css/admin-tokens.css">
  <link rel="stylesheet" href="css/admin-layout.css">
  <link rel="stylesheet" href="css/inventory.css">
</head>
<body class="admin-app">

  <nav class="admin-sidebar" aria-label="Admin navigation">
    <header class="admin-sidebar__header">
      <span class="admin-sidebar__logo-text">Favo Cafe</span>
      <span class="admin-sidebar__tagline">Admin</span>
    </header>
    <ul class="admin-sidebar__nav" role="list">
      <li class="admin-sidebar__item">
        <a class="admin-sidebar__link" href="/admin/dashboard.html">
          <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
      </li>
      <li class="admin-sidebar__item">
        <a class="admin-sidebar__link" href="/admin/pos.html">
          <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Point of Sale
        </a>
      </li>
      <li class="admin-sidebar__item admin-sidebar__item--active">
        <a class="admin-sidebar__link" href="/admin/inventory.html">
          <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          Inventory
        </a>
      </li>
      <li class="admin-sidebar__item">
        <a class="admin-sidebar__link" href="/admin/crm.html">
          <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customers
        </a>
      </li>
      <li class="admin-sidebar__item">
        <a class="admin-sidebar__link" href="/admin/loyalty.html">
          <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Loyalty
        </a>
      </li>
      <li class="admin-sidebar__item">
        <a class="admin-sidebar__link" href="/admin/users.html">
          <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Staff Users
        </a>
      </li>
    </ul>
    <footer class="admin-sidebar__footer">
      <button class="admin-sidebar__logout" id="logout-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </footer>
  </nav>

  <div class="admin-content">

    <header class="admin-topbar">
      <h1 class="admin-topbar__title">Inventory</h1>
      <div class="admin-topbar__user" id="topbar-user"></div>
    </header>

    <main class="admin-main" id="main-content">

      <section class="admin-stats" aria-label="Inventory metrics">
        <article class="stat-card" id="stat-total">
          <p class="stat-card__label">Total Items</p>
          <p class="stat-card__value" id="stat-total-value">&#8212;</p>
        </article>
        <article class="stat-card" id="stat-low-stock">
          <p class="stat-card__label">Low Stock</p>
          <p class="stat-card__value" id="stat-low-stock-value">&#8212;</p>
        </article>
      </section>

      <section class="admin-panel" aria-labelledby="inventory-heading">
        <header class="admin-panel__header">
          <h2 class="admin-panel__title" id="inventory-heading">Stock Items</h2>
        </header>

        <div class="inv-toolbar">
          <div class="inv-toolbar__search-wrap">
            <svg class="inv-toolbar__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <label class="inv-toolbar__search-sr" for="inv-search">Search inventory</label>
            <input
              class="inv-toolbar__search"
              type="search"
              id="inv-search"
              placeholder="Search by name, category or supplier&#x2026;"
              aria-label="Search inventory items"
              autocomplete="off"
            >
          </div>
          <button class="inv-toolbar__add-btn" id="inv-add-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Item
          </button>
        </div>

        <div class="admin-panel__body" id="inv-table-container">
          <p class="admin-empty">Loading inventory&#x2026;</p>
        </div>
      </section>

    </main>
  </div>

  <div class="inv-overlay" id="inv-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="inv-modal-title" hidden>
    <div class="inv-modal">
      <header class="inv-modal__header">
        <h2 class="inv-modal__title" id="inv-modal-title">Add Item</h2>
        <button class="inv-modal__close" id="inv-modal-close" type="button" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <form class="inv-modal__form" id="inv-item-form" novalidate>
        <input type="hidden" id="inv-item-id">

        <fieldset class="inv-form__fieldset">
          <legend class="inv-form__legend">Item Details</legend>

          <div class="inv-form__group">
            <label class="inv-form__label" for="inv-field-name">
              Name <span class="inv-form__required" aria-hidden="true">*</span>
            </label>
            <input
              class="inv-form__input"
              type="text"
              id="inv-field-name"
              name="name"
              required
              autocomplete="off"
              placeholder="e.g. Ethiopia Yirgacheffe"
            >
          </div>

          <div class="inv-form__row">
            <div class="inv-form__group">
              <label class="inv-form__label" for="inv-field-category">
                Category <span class="inv-form__required" aria-hidden="true">*</span>
              </label>
              <select
                class="inv-form__input inv-form__select"
                id="inv-field-category"
                name="category"
                required
              >
                <option value="" disabled selected>Select category…</option>
                <option value="green_bean">Green Bean</option>
                <option value="roasted_bean">Roasted Bean</option>
                <option value="milk">Milk</option>
                <option value="syrup">Syrup</option>
                <option value="food_ingredient">Food Ingredient</option>
                <option value="packaging">Packaging</option>
                <option value="equipment">Equipment</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="inv-form__group">
              <label class="inv-form__label" for="inv-field-unit">
                Unit <span class="inv-form__required" aria-hidden="true">*</span>
              </label>
              <input
                class="inv-form__input"
                type="text"
                id="inv-field-unit"
                name="unit"
                required
                autocomplete="off"
                placeholder="e.g. kg, bags, litres"
              >
            </div>
          </div>

          <div class="inv-form__row">
            <div class="inv-form__group">
              <label class="inv-form__label" for="inv-field-quantity">
                Quantity <span class="inv-form__required" aria-hidden="true">*</span>
              </label>
              <input
                class="inv-form__input"
                type="number"
                id="inv-field-quantity"
                name="quantity"
                required
                min="0"
                step="0.01"
                placeholder="0"
              >
            </div>
            <div class="inv-form__group">
              <label class="inv-form__label" for="inv-field-reorder">
                Reorder Level <span class="inv-form__required" aria-hidden="true">*</span>
              </label>
              <input
                class="inv-form__input"
                type="number"
                id="inv-field-reorder"
                name="reorder_level"
                required
                min="0"
                step="0.01"
                placeholder="0"
              >
            </div>
          </div>

          <div class="inv-form__group">
            <label class="inv-form__label" for="inv-field-supplier">Supplier</label>
            <input
              class="inv-form__input"
              type="text"
              id="inv-field-supplier"
              name="supplier"
              autocomplete="off"
              placeholder="e.g. Cape Coffee Beans"
            >
          </div>
        </fieldset>

        <p class="inv-form__error" id="inv-form-error" role="alert" hidden></p>

        <footer class="inv-modal__footer">
          <button class="inv-modal__cancel" type="button" id="inv-modal-cancel">Cancel</button>
          <button class="inv-modal__save" type="submit" id="inv-modal-save">Save Item</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="inv-overlay" id="inv-delete-overlay" role="dialog" aria-modal="true" aria-labelledby="inv-delete-title" hidden>
    <div class="inv-modal inv-modal--narrow">
      <header class="inv-modal__header">
        <h2 class="inv-modal__title" id="inv-delete-title">Delete Item</h2>
        <button class="inv-modal__close" id="inv-delete-close" type="button" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <div class="inv-modal__body">
        <p class="inv-delete__message">
          Are you sure you want to delete <strong id="inv-delete-name"></strong>? This action cannot be undone.
        </p>
      </div>
      <footer class="inv-modal__footer">
        <button class="inv-modal__cancel" type="button" id="inv-delete-cancel">Cancel</button>
        <button class="inv-modal__delete" type="button" id="inv-delete-confirm">Delete</button>
      </footer>
    </div>
  </div>

  <script src="js/admin-auth.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
